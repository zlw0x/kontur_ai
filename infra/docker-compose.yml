services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../apps/api/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN}
      MANUAL_API_TOKEN: ${MANUAL_API_TOKEN}
      WORKER_REPOSITORY_MODE: sql
      ARTIFACT_STORE_ROOT: /data/artifacts
      WEB_ORIGIN: ${WEB_ORIGIN}
      # Off by default in the settings, and named here so an operator turning it on
      # for a demonstration has one place to look. With it off a finished build waits
      # for a person; with it on the order goes straight through, which is what the
      # service did before there was a queue.
      AUTOMATIC_ACCEPTANCE: ${AUTOMATIC_ACCEPTANCE:-false}
      # One machine, one person: no sign-in and no moderation queue. Off unless the
      # env file says otherwise, and the API refuses to start with it on when
      # ENVIRONMENT is anything but `local` — so it cannot travel with this file.
      OPEN_LOCAL_ACCESS: ${OPEN_LOCAL_ACCESS:-false}
      # Empty means the sanitizer's process mode, which still has RLIMIT_AS,
      # RLIMIT_CPU and a wall clock in this image because it is Linux. Production
      # names an image here; outside `local` the process mode is refused on a
      # platform that cannot enforce those ceilings at all.
      SANITIZER_IMAGE: ${SANITIZER_IMAGE:-}
    ports: ["8000:8000"]
    volumes: ["artifact-data:/data/artifacts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  artifact-data:
