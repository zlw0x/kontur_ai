name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt
      - run: pytest -q
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install jsonschema
      - run: python scripts/validate_schemas.py
      - run: python scripts/check_openapi_compatibility.py
  local-worker:
    runs-on: windows-latest
    defaults: {run: {working-directory: apps/local-worker}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet build CadAi.LocalWorker.csproj --nologo
      - run: dotnet test ../../packages/kompas-adapter/tests/CadAi.KompasAdapter.Tests.csproj --nologo
      - run: dotnet test ../../packages/codex-runner/tests/CadAi.CodexRunner.Tests.csproj --nologo
      - run: dotnet test ../../packages/geometry-validation/tests/CadAi.GeometryValidation.Tests.csproj --nologo
      - run: dotnet test tests/CadAi.LocalWorker.Tests.csproj --nologo
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run build
