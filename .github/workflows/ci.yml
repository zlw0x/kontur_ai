name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt
      - run: pytest -q
  # The sanitizer's own job, because its tests need an image decoder and the API's
  # must never have one. Without this the suite would `importorskip` on Pillow and
  # report green while nothing in it ran — the failure mode that hid three stale
  # fixture names through a whole contract version.
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r packages/image-sanitizer/requirements.txt pytest==8.4.1
      - name: The sanitizer's own tests, where a skip is a failure
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=packages/image-sanitizer pytest -q packages/image-sanitizer/tests \
            | tee sanitizer.log
          # Without Pillow the module skips whole and the job is green with nothing
          # run, so the summary is read rather than trusted.
          if grep -qE '[0-9]+ skipped' sanitizer.log; then
            echo "::error::the sanitizer suite skipped tests; its decoder is missing"
            exit 1
          fi
  # The container the addendum §2.2 asks for, built and driven with a real bomb.
  #
  # The argv was assembled and asserted by a unit test long before an image existed,
  # and an argv nobody has run is a description of an intention. What this adds over
  # the process mode is the namespace: the process mode bounds how much a decoder can
  # *spend*, and only a container bounds what it can *see*.
  sanitizer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: docker build -t cad-ai/sanitizer:ci packages/image-sanitizer
      - name: A bomb and an ordinary page, through the container
        shell: bash
        run: |
          set -euo pipefail
          pip install -r packages/image-sanitizer/requirements.txt
          mkdir -p bomb/in bomb/out
          python - <<'MAKE'
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          # ~2.6 MB on disk, ~2 GiB decoded. The decompression bomb is the reason
          # `Image.verify()` is not enough and `max_pixels` exists.
          Image.new("RGB", (30000, 30000), (255, 255, 255)).save("bomb/in/bomb.png", optimize=True)
          Image.new("RGB", (8, 6), (12, 34, 56)).save("bomb/in/ordinary.png")
          MAKE
          run() {
            docker run --rm --network none --read-only --cap-drop ALL               --security-opt no-new-privileges               --memory 805306368 --memory-swap 805306368 --cpus 2 --pids-limit 64               --user 65534:65534               -v "$PWD/bomb/in:/in:ro" -v "$PWD/bomb/out:/out"               cad-ai/sanitizer:ci --source "/in/$1" --output "/out/$2"               --max-width 12000 --max-height 12000 --max-pixels 60000000               --max-frames 1 --max-output-bytes 41943040               --memory-bytes 805306368 --cpu-seconds 20 || true
          }

          ordinary=$(run ordinary.png page-001.png)
          echo "ordinary: $ordinary"
          bomb=$(run bomb.png bomb-out.png)
          echo "bomb: $bomb"

          # Read for what they say rather than for an exit code. A guard written as
          # `grep -qv` succeeds on any line that is not the one it names, which is
          # every line -- that mistake shipped in this file's first version and made
          # a job green that had run nothing.
          echo "$ordinary" | grep -q '"ok": true'             || { echo "::error::an ordinary page was not accepted"; exit 1; }
          echo "$ordinary" | grep -q '"limits": "rlimit"'             || { echo "::error::the container decoded without kernel ceilings"; exit 1; }
          echo "$bomb" | grep -q '"code": "INPUT_PIXELS_TOO_MANY"'             || { echo "::error::a decompression bomb was not refused"; exit 1; }
          test -f bomb/out/page-001.png             || { echo "::error::the accepted page was not written"; exit 1; }
          test ! -f bomb/out/bomb-out.png             || { echo "::error::the refused bomb left a file behind"; exit 1; }

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r apps/api/requirements.txt
      - run: python scripts/generate_schemas.py --check
      # The published OpenAPI document, against the routes that actually exist. It
      # had been stale since 0007 — `retry_after` was added to two models and
      # nothing regenerated it — because the two checks below cannot see a field
      # that never arrived: one validates the document's shape, the other only that
      # nothing v1 promised has disappeared.
      - run: python scripts/generate_openapi.py --check
      - run: python scripts/validate_schemas.py
      - run: python scripts/check_openapi_compatibility.py
  # Real geometry, on a Linux runner, with no licence and no GUI — the whole
  # point of ADR-023. The `api` job runs these too, but without the engine
  # installed, so there the parity suite skips itself and only the neutral half
  # runs. This job is the one that actually builds the fixtures.
  cad-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # The version the worker's own image pins. A parity run on a different
        # interpreter would be evidence about a build nobody ships.
        with: {python-version: "3.12"}
      # OpenCascade links against these even headless; the same list the
      # worker's Dockerfile installs, for the same reason.
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1 libglu1-mesa libxi6 libxmu6 libsm6 libice6 libx11-6 \
            libexpat1 libfontconfig1 fonts-dejavu-core
      - run: pip install -r apps/cad-worker/requirements.txt pytest==8.4.1
      - run: pytest -q packages/build123d-adapter/tests apps/cad-worker/tests
      # The launcher against the engine it launches. The stub tests run in the
      # `worker` job too, and they cannot catch the one thing this can: the C#
      # records and the JSON the Python worker prints are two hand-written
      # descriptions of one format, and only a run with both sides present
      # notices when they drift.
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet test packages/build123d-launcher/tests/CadAi.Build123dLauncher.Tests.csproj --nologo
  # The .NET half, on Linux. It ran on windows-latest until ENGINE-MIG-008,
  # because the CAD adapter was COM and the worker was `net8.0-windows`; both are
  # gone, so the platform the production worker runs on is now the platform CI
  # checks it on.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet build CadAi.sln --nologo
      - run: dotnet test CadAi.sln --nologo --no-build
  # Windows is still a supported place to run the worker — an operator's machine
  # with Codex signed in — so it is still built and tested there. What changed is
  # that it is no longer the only place, and no longer where the CAD engine lives.
  worker-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet build CadAi.sln --nologo
      - run: dotnet test CadAi.sln --nologo --no-build
  # The engine as it actually ships. Everything else runs the interpreter from a
  # checkout; this is the artifact a deployment pulls, and until now nothing built
  # it (ENGINE-MIG-008).
  #
  # Not pushed anywhere. Publishing is a deployment decision with a registry and
  # a credential behind it; what CI owes is that the image builds and that the
  # thing inside it answers.
  cad-worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/cad-worker/Dockerfile -t cad-ai/cad-worker:ci .
      # Run it the way the launcher runs it, so the image is checked under the
      # restrictions it will actually have rather than under none.
      - run: |
          docker run --rm --read-only --network none --user "$(id -u):$(id -g)" \
            --tmpfs /tmp cad-ai/cad-worker:ci describe > described.json
          cat described.json
          python3 -c "import json,sys; d=json.load(open('described.json')); \
            assert d['engine_id']=='build123d', d; \
            assert [a['kind'] for a in d['artifacts']]==['STEP','STL'], d; \
            assert d['capabilities']['solid.revolve']['status'] in ('beta','stable'), d; \
            print('image describes itself:', d['engine_version'], d['kernel_version'])"
      # And it builds a real part, in the container, with a bind-mounted job and
      # nothing else writable. A `describe` that works proves the wheels
      # installed; this proves the kernel runs.
      - run: |
          mkdir -p job
          # The version comes from the contract, not from this file: a fixture
          # rename used to mean editing every place that named one, and the last
          # bump left three of them behind (see tests/cad_ir_fixtures.py).
          suffix=$(python3 -c "import sys; sys.path.insert(0, 'packages/cad-ir'); \
            from cad_ir.canonical import CAD_IR_VERSION; \
            print('v' + CAD_IR_VERSION.replace('.', '_'))")
          cp "tests/fixtures/cad-ir/lever-plate.$suffix.json" job/cad-ir.json
          # The uid the launcher passes in production, for the same reason: the
          # job directory is a bind mount owned by whoever runs the worker, and a
          # container running as anyone else cannot write the results into it.
          docker run --rm --read-only --network none --user "$(id -u):$(id -g)" \
            --tmpfs /tmp --mount "type=bind,src=$PWD/job,dst=/work" \
            cad-ai/cad-worker:ci build --job /work
          test -s job/output/model.step
          test -s job/output/model.stl
      # And the launcher against the same image, in the mode production uses. Every
      # other check of container mode reads the argument list the launcher builds,
      # which is the right way to test that `--read-only` is there and cannot check
      # whether a real daemon accepts the whole invocation. These tests skip
      # themselves unless CAD_ENGINE_IMAGE names an image, so this is the one job
      # that can run them.
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - run: dotnet test packages/build123d-launcher/tests --nologo
        env:
          CAD_ENGINE_IMAGE: cad-ai/cad-worker:ci
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run build
